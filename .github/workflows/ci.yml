name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floorplan-analyzer/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: floorplan-analyzer/backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floorplan-analyzer/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: floorplan-analyzer/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: floorplan-analyzer
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      OPENAI_API_KEY: ''
      OPENAI_MODEL: ''
      AI_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build both production containers
        run: docker compose build
      - name: Start containers and wait for their health checks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify frontend, API proxy and sample analysis
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/ > /tmp/floorplan-page.html
          test -s /tmp/floorplan-page.html
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/api/health | jq -e '.status == "ok"'
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/sample_mask.json > /tmp/floorplan-sample.json
          curl --fail --silent --show-error --max-time 60 \
            -F 'file=@/tmp/floorplan-sample.json;type=application/json' \
            'http://127.0.0.1:3000/api/analyze?scale_px=96.7&scale_m=1.365' > /tmp/floorplan-result.json
          jq -e '
            .summary.room_count == 11 and .summary.wall_count == 21 and .summary.door_count == 9
            and (.rooms | length) == 11
            and .summary.total_floor_area_m2 > 0 and .summary.total_wall_area_m2 > 0
            and .settings.scale_px == 96.7 and .settings.scale_m == 1.365
            and ([.rooms[] | select(.name == "LD" or .name == "K") | .floor_area_m2] | add) > 26.5
            and ([.rooms[] | select(.name == "LD" or .name == "K") | .floor_area_m2] | add) < 28.5
          ' /tmp/floorplan-result.json
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - run: terraform fmt -check -recursive floorplan-analyzer/infra/terraform
      - name: Validate both independent states without AWS credentials
        run: |
          for part in bootstrap app; do
            terraform -chdir="floorplan-analyzer/infra/terraform/$part" init -backend=false -input=false
            terraform -chdir="floorplan-analyzer/infra/terraform/$part" validate
          done
