[pytest]
minversion = 8.0
testpaths = ../test/gpt-6/backend
pythonpath = .
# 失敗時に読みやすくする: 短いトレースバック、失敗・スキップ・警告の要約（-ra）、
# 未定義のマーカーや設定の誤りは即エラー
addopts = -ra --tb=short --strict-markers --strict-config
xfail_strict = true
# キャプチャしたログの書式。失敗時の表示と、--log-cli-level=INFO で流すときに使う
log_level = INFO
log_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_date_format = %H:%M:%S
junit_family = xunit2
